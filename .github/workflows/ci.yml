# Continuous integration. UNVERIFIED: this workflow has not been executed on GitHub (no access from the
# authoring sandbox); every command it runs was executed locally. Action refs use version tags until
# `python3 scripts/pin-actions.py` is run to pin them to full commit SHAs (see docs/ci-cd.md).
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.12.0'
  PGPASS: ci_only_password # throwaway CI database; not a real secret

jobs:
  quality:
    name: Lint, format, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit

  api-integration:
    name: API integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          {
            POSTGRES_USER: shopsphere,
            POSTGRES_PASSWORD: ci_only_password,
            POSTGRES_DB: shopsphere_test,
          }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U shopsphere" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://shopsphere:ci_only_password@localhost:5432/shopsphere_test
      TEST_DATABASE_URL: postgresql://shopsphere:ci_only_password@localhost:5432/shopsphere_test
      CORS_ORIGINS: http://localhost:5173
      APP_URL: http://localhost:5173
      PAYMENT_WEBHOOK_SECRET: ci_only_webhook_secret_0123456789abcdef
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run build:shared && npm run generate
      # Validate the REAL Prisma migration path (the authoring sandbox could not run this):
      - name: prisma migrate deploy on a scratch database
        run: npm run db:migrate -w @shopsphere/api
      - name: Schema/migration drift check (fails if schema.prisma and migrations disagree)
        run: npm run db:drift-check -w @shopsphere/api
      - name: Integration tests with coverage
        run: npm run test:coverage -w @shopsphere/api
      - uses: actions/upload-artifact@v4.5.0
        if: always()
        with: { name: api-coverage, path: apps/api/coverage, retention-days: 7 }

  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          {
            POSTGRES_USER: shopsphere,
            POSTGRES_PASSWORD: ci_only_password,
            POSTGRES_DB: shopsphere_e2e,
          }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U shopsphere" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://shopsphere:ci_only_password@localhost:5432/shopsphere_e2e
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run build:shared && npm run generate && npm run build -w @shopsphere/web
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4.5.0
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  dependency-audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci --ignore-scripts
      - name: Dependency audit (fails on HIGH/CRITICAL; reviewed allowlist in audit-ci.jsonc)
        run: npm run audit
      - uses: actions/dependency-review-action@v4.5.0
        if: github.event_name == 'pull_request'

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2.3.7
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }

  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  build-images:
    name: Build container images + Trivy image scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [quality]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/setup-buildx-action@v3.8.0
      - uses: docker/build-push-action@v6.10.0
        with:
          {
            context: .,
            file: apps/api/Dockerfile,
            target: runtime,
            load: true,
            tags: 'shopsphere-api:ci',
            cache-from: type=gha,
            cache-to: 'type=gha,mode=max',
          }
      - uses: docker/build-push-action@v6.10.0
        with:
          {
            context: .,
            file: apps/web/Dockerfile,
            load: true,
            tags: 'shopsphere-web:ci',
            cache-from: type=gha,
            cache-to: 'type=gha,mode=max',
          }
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          {
            image-ref: 'shopsphere-api:ci',
            severity: 'HIGH,CRITICAL',
            ignore-unfixed: true,
            exit-code: '1',
          }
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          {
            image-ref: 'shopsphere-web:ci',
            severity: 'HIGH,CRITICAL',
            ignore-unfixed: true,
            exit-code: '1',
          }

  summary:
    name: Publish summary
    runs-on: ubuntu-latest
    if: always()
    needs: [quality, api-integration, e2e, dependency-audit, secret-scan, trivy-fs, build-images]
    steps:
      - run: |
          {
            echo "## CI results"
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| quality | ${{ needs.quality.result }} |"
            echo "| api-integration | ${{ needs.api-integration.result }} |"
            echo "| e2e | ${{ needs.e2e.result }} |"
            echo "| dependency-audit | ${{ needs.dependency-audit.result }} |"
            echo "| secret-scan | ${{ needs.secret-scan.result }} |"
            echo "| trivy-fs | ${{ needs.trivy-fs.result }} |"
            echo "| build-images | ${{ needs.build-images.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
