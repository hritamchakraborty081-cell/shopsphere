name: CodeQL
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: github/codeql-action/init@v4.38.2
        with: { languages: javascript-typescript, queries: security-extended }
      - uses: github/codeql-action/analyze@v4.38.2
